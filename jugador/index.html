<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#11131a">
  <title>Mis mesas · CronoApp</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#11131a;color:#f7f7fb;--muted:#b8bac8;--accent:#ff8a24;--panel:#1b1d26;--edge:#3b3d49}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#29263e 0,#11131a 55%)}
    main{width:min(100% - 28px,760px);margin:0 auto;padding:24px 0 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:34px}.brand{font-size:13px;font-weight:900;letter-spacing:.15em}.top a,.secondary{color:#e7e1ff;text-decoration:none;border:1px solid var(--edge);border-radius:10px;padding:10px 14px;background:var(--panel);font:inherit;font-weight:700}
    .hero{margin-bottom:24px}.eyebrow{color:var(--accent);font-size:12px;font-weight:900;letter-spacing:.13em}h1{font-size:clamp(30px,7vw,48px);letter-spacing:-.04em;margin:8px 0}p{color:var(--muted);line-height:1.5}.card,.match{border:1px solid var(--edge);border-radius:18px;background:var(--panel);padding:20px;margin:14px 0}.form{display:grid;gap:12px}.form[hidden],#playerPanel[hidden]{display:none}label{font-size:14px;font-weight:800}input{width:100%;min-height:48px;padding:12px 14px;border:1px solid #4a4b5a;border-radius:10px;background:#11131a;color:white;font:inherit;font-size:18px}button{min-height:46px;border:0;border-radius:10px;background:var(--accent);color:#19130d;padding:0 16px;font:inherit;font-weight:900;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.status{min-height:24px;color:#ffd6b0;font-size:14px}.player-name{color:var(--accent);font-weight:900}.meta{font-size:13px;color:var(--muted)}.opponent{font-size:clamp(24px,5vw,34px);font-weight:850;margin:8px 0}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.actions button{background:#282a35;color:#fff;border:1px solid #55515a}.section-title{margin:28px 0 10px;font-size:20px}.history{display:grid;gap:10px}.history .match{margin:0}.empty{padding:18px;border:1px dashed var(--edge);border-radius:14px;color:var(--muted)}.footer{margin-top:28px;font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
  <main>
    <nav class="top"><span class="brand">CRONOAPP</span><a href="/">Inicio</a></nav>
    <header class="hero"><span class="eyebrow">VISTA PARA JUGADORES · PRUEBA</span><h1>Encuentra tu mesa</h1><p>Ingresa el código de la sala y tu ID de jugador para ver tus pareos y reportar el resultado junto a tu oponente.</p></header>
    <section id="entryPanel" class="card">
      <form id="entryForm" class="form">
        <label for="roomCode">Código de sala</label><input id="roomCode" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="Ej. 7KQ2BD" required>
        <label for="playerId">ID de jugador</label><input id="playerId" inputmode="numeric" autocomplete="off" maxlength="16" placeholder="Ingresa tu ID" required>
        <button type="submit">Ver mis mesas</button>
      </form>
      <p id="entryStatus" class="status" role="status" aria-live="polite"></p>
    </section>
    <section id="playerPanel" hidden>
      <div class="card"><div class="meta" id="eventTitle"></div><h2 id="playerGreeting">Tus pareos</h2><p id="playerStatus" class="status" role="status" aria-live="polite"></p><button id="changePlayer" class="secondary" type="button">Cambiar sala o jugador</button></div>
      <h2 class="section-title">Ronda actual</h2><div id="currentMatches"></div>
      <h2 class="section-title">Historial del torneo</h2><div id="matchHistory" class="history"></div>
    </section>
    <p class="footer">Tu ID se usa para encontrar tus mesas y no aparece en la pantalla.</p>
  </main>
  <script type="module">
    const config={apiKey:"AIzaSyDQpTvOLF-RqYZQJHe8cCk_0E8E5M5GkK8",authDomain:"cronoapp-97aa6.firebaseapp.com",databaseURL:"https://cronoapp-97aa6-default-rtdb.firebaseio.com",projectId:"cronoapp-97aa6",storageBucket:"cronoapp-97aa6.firebasestorage.app",messagingSenderId:"482155443294",appId:"1:482155443294:web:b62c46a3ae16ca551630cf"};
    const base='https://www.gstatic.com/firebasejs/12.19.0/';
    const [{initializeApp},{getDatabase,ref,get,onValue,set},{getAuth,signInAnonymously}]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-database.js'),import(base+'firebase-auth.js')]);
    const app=initializeApp(config),db=getDatabase(app),auth=getAuth(app);
    const $=id=>document.getElementById(id);let roomId='',playerId='',pairings=null,officialResults={},playerReports={},stopPairings=null,stopOfficial=null,stopReports=null;
    function matchKey(event,ci,round,match){return `e${event}_c${ci}_r${round.number}_t${match.table}`}
    function resultLabel(result){if(!result)return '';if(result.winner==='draw')return 'Empate';return result.winnerName||'Resultado informado'}
    function playerVoteStatus(report){if(!report?.first&&!report?.second)return 'Aún no hay confirmaciones';if(!report.first||!report.second)return 'Esperando la confirmación del otro jugador';if(report.first.winner===report.second.winner)return 'Resultado confirmado por ambos jugadores';return 'Los reportes no coinciden. Staff debe revisar el resultado.'}
    function makeCard(item,latest){
      const {category,round,match,key,side}=item,card=document.createElement('article');card.className='match';
      const meta=document.createElement('div');meta.className='meta';meta.textContent=`Ronda ${round.number} · ${category} · Mesa ${match.table}`;
      const opponent=document.createElement('div');opponent.className='opponent';opponent.textContent=side==='first'?match.second:match.first;
      const official=officialResults[key],report=playerReports[key];
      const result=document.createElement('p');result.textContent=official?`Resultado oficial: ${resultLabel(official)}`:report?playerVoteStatus(report):match.outcome?`Resultado del TDF: ${{'1':match.first,'2':match.second,'3':'Empate','5':match.first}[match.outcome]||'Pendiente'}`:'Sin resultado reportado';
      card.append(meta,opponent,result);
      if(latest&&!official){
        const own=report?.[side];
        if(own){const note=document.createElement('p');note.textContent='Ya registraste tu confirmación.';card.append(note)}
        else if(match.second!=='BYE'&&pairings.eventId){
          const controls=document.createElement('div');controls.className='actions';
          const options=[['first',`Gana ${match.first}`],['second',`Gana ${match.second}`],['draw','Empate']];
          for(const [winner,label] of options){const button=document.createElement('button');button.type='button';button.textContent=label;button.addEventListener('click',async()=>{
            if(!confirm(`¿Confirmas el resultado de la mesa ${match.table}: ${label}?`))return;
            button.disabled=true;
            const target=ref(db,`playerReports/${roomId}/${pairings.eventId}/tables/${key}/${side}`),vote={winner,uid:auth.currentUser.uid,submittedAt:Date.now()};
            try{await set(target,vote);$('playerStatus').textContent='Confirmación registrada.'}
            catch(error){
              console.error('Error al guardar confirmación del jugador:',error);
              try{
                const existing=await get(target);
                if(existing.exists()&&existing.val()?.uid===auth.currentUser.uid){$('playerStatus').textContent='Tu confirmación ya estaba registrada.';button.disabled=true;return}
              }catch(readError){console.error('No se pudo comprobar la confirmación:',readError)}
              const code=error?.code||'desconocido';
              $('playerStatus').textContent=code==='PERMISSION_DENIED'||code==='permission-denied'
                ?'Firebase rechazó el permiso. Publica las reglas actualizadas de database.rules.json, que incluyen playerReports.'
                :`No se pudo registrar tu confirmación (${code}). Inténtalo nuevamente.`;
              button.disabled=false;
            }
          });controls.append(button)}card.append(controls);
        } else if(latest&&match.second==='BYE'){const note=document.createElement('p');note.textContent='Esta ronda es un BYE; no requiere reporte.';card.append(note)}
      }
      return card;
    }
    function render(){
      $('currentMatches').replaceChildren();$('matchHistory').replaceChildren();
      if(!pairings?.categories?.length){$('playerStatus').textContent='Esta sala todavía no tiene un TDF publicado.';return}
      $('eventTitle').textContent=pairings.title||'Torneo';
      if(!pairings.eventId||!pairings.categories.some(c=>c.rounds?.some(r=>r.matches?.some(m=>m.firstPlayerId||m.secondPlayerId)))){$('playerStatus').textContent='El TDF publicado no tiene datos de ID de jugador. Administración debe volver a cargarlo desde CronoApp.';return}
      const history=[],current=[];let found=false;
      pairings.categories.forEach((category,ci)=>{
        const rounds=category.rounds||[],latestRound=rounds.at(-1);
        rounds.forEach(round=>round.matches.forEach(match=>{
          let side=String(match.firstPlayerId)===playerId?'first':String(match.secondPlayerId)===playerId?'second':'';
          if(!side)return;found=true;if(!$('playerGreeting').dataset.name){const playerName=side==='first'?match.first:match.second;$('playerGreeting').textContent='Hola, '+playerName;$('playerGreeting').dataset.name=playerName}
          const item={category:category.name||'Categoría',round,match,key:matchKey(pairings.eventId,ci,round,match),side};
          history.push(item);if(round===latestRound)current.push(item);
        }));
      });
      if(!found){$('playerStatus').textContent='No encontramos ese ID en el TDF de esta sala. Revisa el código y el ID.';return}
      $('playerStatus').textContent='';
      current.forEach(item=>$('currentMatches').append(makeCard(item,true)));
      if(!current.length)$('currentMatches').innerHTML='<div class="empty">No tienes una mesa asignada en la última ronda.</div>';
      history.sort((a,b)=>b.round.number-a.round.number||a.match.table-b.match.table).forEach(item=>$('matchHistory').append(makeCard(item,false)));
    }
    async function connect(code,id){
      $('entryStatus').textContent='Conectando con la sala…';
      try{
        if(!auth.currentUser)await signInAnonymously(auth);
        const alias=await get(ref(db,`shortRooms/${code}`));roomId=alias.val();
        if(!roomId){$('entryStatus').textContent='No encontramos una sala con ese código.';return}
        playerId=id;sessionStorage.setItem('cronoapp-player-room',code);sessionStorage.setItem('cronoapp-player-id',id);
        $('entryPanel').hidden=true;$('playerPanel').hidden=false;
        const pairRef=ref(db,`rooms/${roomId}/pairings`),officialRef=ref(db,`roomResults/${roomId}/tables`);
        stopPairings=onValue(pairRef,snap=>{try{pairings=snap.exists()?JSON.parse(snap.val()):null;render();if(pairings?.eventId){const reportsRef=ref(db,`playerReports/${roomId}/${pairings.eventId}/tables`);if(stopReports)stopReports();stopReports=onValue(reportsRef,s=>{playerReports=s.val()||{};render()})}}catch(error){$('playerStatus').textContent='No se pudieron interpretar los pareos de esta sala.';console.error(error)}},error=>{$('playerStatus').textContent='No se pudo leer el TDF de la sala. Revisa las reglas de Firebase.';console.error(error)});
        stopOfficial=onValue(officialRef,snap=>{officialResults=snap.val()||{};render()},()=>{});
      }catch(error){$('entryStatus').textContent='No se pudo abrir la sala. Revisa el código e inténtalo otra vez.';console.error(error)}
    }
    $('entryForm').addEventListener('submit',event=>{event.preventDefault();const code=$('roomCode').value.trim().toUpperCase(),id=$('playerId').value.trim();if(!/^[A-HJ-NP-Z2-9]{6}$/.test(code)){$('entryStatus').textContent='Ingresa un código válido de 6 caracteres.';return}if(!/^\d{4,16}$/.test(id)){$('entryStatus').textContent='Ingresa un ID de jugador válido.';return}connect(code,id)});
    $('changePlayer').addEventListener('click',()=>{if(stopPairings)stopPairings();if(stopOfficial)stopOfficial();if(stopReports)stopReports();$('playerPanel').hidden=true;$('entryPanel').hidden=false;$('entryStatus').textContent='';$('playerId').value='';$('playerGreeting').textContent='Tus pareos';delete $('playerGreeting').dataset.name;$('playerId').focus()});
    const savedCode=sessionStorage.getItem('cronoapp-player-room'),savedId=sessionStorage.getItem('cronoapp-player-id');if(savedCode&&savedId){$('roomCode').value=savedCode;$('playerId').value=savedId;connect(savedCode,savedId)}
  </script>
</body>
</html>
