<!doctype html>
<html lang="es">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Temporizador para TV</title>
</head>
<body>
  <p>Abriendo el acceso al temporizador… <a id="fallback" href="/?entry=tv">Continuar</a></p>
  <script>
    const params = new URLSearchParams(location.search);
    const hasRoom = params.has('s') || params.has('sala');
    params.delete('entry');
    if (hasRoom) params.set('view', 'pantalla');
    else { params.delete('view'); params.set('entry', 'tv'); }
    const query = params.toString();
    const target = '/' + (query ? '?' + query : '') + location.hash;
    document.getElementById('fallback').href = target;
    location.replace(target);
  </script>
</body>
</html>
