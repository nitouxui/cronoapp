function deckCardDetails(c){
 const rawId=String(c[2]||''),meta=String(c[4]||'').trim();
 if(rawId.startsWith('basic-energy:')){
  const basic=M6.basicEnergies.find(e=>e.id===rawId);
  return {code:'SVE-'+(basic?.localId||'???'),expansion:'Scarlet & Violet Energy'};
 }
 const id=rawId.replace(/^jp:/i,''),match=id.match(/^(.+)-([A-Za-z0-9]+)$/);
 const prefix=match?.[1]||'',parts=meta.split(' · ').map(x=>x.trim()).filter(Boolean);
 const expansion=parts.length>1?parts.slice(0,-1).join(' · '):meta||'Expansión no disponible';
 const rawNumber=(match?.[2]|| (parts.length>1?parts[parts.length-1]:'')).trim();
 const number=/^[0-9]+$/.test(rawNumber)?rawNumber.padStart(3,'0'):rawNumber;
 const isJapanese=/^jp:/i.test(rawId)||/\(\s*(?:JP|JPN)\s*\)|\bJapanese\b|日本語|日本版/i.test(meta);
 if(isJapanese){
  const name=norm(expansion);
  const known=Object.entries(japaneseSetByName).find(([key])=>name.includes(key))?.[1];
  // Las expansiones JP conservan su código impreso (SV11B, M6, M2A...)
  // y nunca se convierten a su expansión inglesa (BLK, WHT, etc.).
  const jpCode=known||prefix.toUpperCase()||'JP';
  return {code:jpCode+(number?'-'+number:''),expansion};
 }
 const normalizedPrefix=prefix.toLowerCase().replace(/^(sv|me)0+([0-9])/,'$1$2');
 const expansionNorm=norm(expansion).replace(/^scarlet\s*(?:&|and)\s*violet\s*[-—]\s*/,'').replace(/^mega evolution\s*[-—]\s*/,'');
 let code=setAbbreviations[normalizedPrefix]||setAbbreviations[prefix.toLowerCase()]||'';
 if(!code){
  for(const [label,abbr] of Object.entries(setNamesToCode)){
   if(expansionNorm===label||expansionNorm.includes(label)){code=abbr;break}
  }
 }
 if(!code)code=prefix.toUpperCase()||'SET';
 return {code:code+(number?'-'+number:''),expansion};
}

 let y=140;
 for(const row of rows){if(row.heading)y+=24;ctx.font=row.font;ctx.fillStyle=row.muted?'#b8c4d8':'#fff';ctx.fillText(row.text,padding,y);y+=lineHeight}
