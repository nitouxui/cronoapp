<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CronoApp · Decklists (demo)</title><style>body{margin:0;background:#101827;color:#eef2ff;font:16px system-ui}main{max-width:980px;margin:auto;padding:28px}h1{margin-bottom:4px}p{color:#b8c4d8}.panel{background:#1d2a40;border:1px solid #39465b;border-radius:16px;padding:20px;margin:16px 0}input,button{font:inherit;border-radius:9px;padding:10px;border:1px solid #66758b}input{background:#101827;color:white;max-width:100%;box-sizing:border-box}button{cursor:pointer;background:#7568f5;color:white;border:0}button:disabled{opacity:.4;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #39465b;gap:12px}.actions{display:flex;gap:6px;align-items:center}.actions button{padding:5px 10px}label{display:block;margin:10px 0}.bar{height:10px;background:#39465b;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:#6dce9e;transition:width .2s}.muted{color:#b8c4d8;font-size:13px}@media print{body{background:white;color:black}button,.catalog,.fields,.muted{display:none!important}.panel{border:0;color:black}main{padding:0}}</style></head><body><main><h1>🃏 CronoApp · Decklists</h1><p>Prototipo independiente con cartas de ejemplo. No conectado a Google, salas ni APIs.</p><section class="panel fields"><div class="grid"><label>Nombre del jugador<br><input id="player" placeholder="Nombre completo"></label><label>Código de sala<br><input id="room" placeholder="Ej. ABC123"></label><label>Nombre del mazo<br><input id="deckname" placeholder="Mi deck"></label></div></section><section class="panel catalog"><h2>Catálogo de prueba</h2><input id="search" placeholder="Buscar carta..." style="width:100%"><div id="catalog"></div></section><section class="panel" id="export"><h2 id="title">Mi Decklist</h2><p id="info"></p><strong id="total">0 / 60 cartas</strong><div class="bar"><div id="progress"></div></div><div id="deck"></div><p id="message"></p><div class="actions"><button onclick="copyList()">Copiar lista</button><button onclick="window.print()">Guardar PDF</button><button onclick="downloadPNG()">Descargar PNG</button></div></section><p class="muted">Demo: las cartas son ficticias y no se validan reglas oficiales. El código de sala solo aparece en la exportación; no envía datos.</p></main><script>const cards=[['Pikachu','Pokémon'],['Charizard ex','Pokémon'],['Mew ex','Pokémon'],['Pidgeot ex','Pokémon'],['Rare Candy','Entrenadores'],['Ultra Ball','Entrenadores'],['Nest Ball','Entrenadores'],['Professor’s Research','Entrenadores'],['Boss’s Orders','Entrenadores'],['Iono','Entrenadores'],['Arven','Entrenadores'],['Switch','Entrenadores'],['Basic Fire Energy','Energías'],['Basic Lightning Energy','Energías'],['Basic Psychic Energy','Energías']];const counts={};const $=id=>document.getElementById(id);function total(){return Object.values(counts).reduce((a,b)=>a+b,0)}function change(i,d){let max=cards[i][1]==='Energías'?60:4;let n=Math.max(0,Math.min(max,(counts[i]||0)+d));if(total()+d>60&&d>0)return;counts[i]=n;render()}function render(){let q=$('search').value.toLowerCase();$('catalog').innerHTML=cards.map((c,i)=>({c,i})).filter(x=>x.c[0].toLowerCase().includes(q)).map(({c,i})=>'<div class="item"><span>'+c[0]+' <small class="muted">· '+c[1]+'</small></span><div class="actions"><button onclick="change('+i+',-1)">−</button><b>'+(counts[i]||0)+'</b><button onclick="change('+i+',1)">+</button></div></div>').join('')||'<p>Sin resultados</p>';$('deck').innerHTML=['Pokémon','Entrenadores','Energías'].map(cat=>{let rows=cards.map((c,i)=>({c,i})).filter(x=>x.c[1]===cat&&counts[x.i]>0);return rows.length?'<h3>'+cat+' ('+rows.reduce((n,x)=>n+counts[x.i],0)+')</h3>'+rows.map(x=>'<div class="item">'+counts[x.i]+' × '+x.c[0]+'</div>').join(''):''}).join('');$('total').textContent=total()+' / 60 cartas';$('progress').style.width=total()/60*100+'%';$('message').textContent=total()===60?'Lista completa (sin validación oficial)':'Faltan '+(60-total())+' cartas';$('title').textContent=$('deckname').value||'Mi Decklist';$('info').textContent=[$('player').value,$('room').value?'Sala: '+$('room').value:''].filter(Boolean).join(' · ')}function listText(){return [$('title').textContent,$('info').textContent,...cards.map((c,i)=>counts[i]?counts[i]+' '+c[0]:'').filter(Boolean),'Total: '+total()].join('\n')}async function copyList(){try{await navigator.clipboard.writeText(listText());alert('Lista copiada')}catch(e){alert('No se pudo copiar; usa una conexión segura')}}function downloadPNG(){const lines=listText().split('\n');const canvas=document.createElement('canvas');canvas.width=1000;canvas.height=Math.max(480,140+lines.length*38);const ctx=canvas.getContext('2d');ctx.fillStyle='#101827';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.font='bold 36px system-ui';ctx.fillText('CronoApp · Decklist',40,65);ctx.font='26px system-ui';lines.forEach((s,i)=>ctx.fillText(s,40,120+i*38));const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='cronoapp-decklist.png';a.click()}$('search').addEventListener('input',render);['player','room','deckname'].forEach(x=>$(x).addEventListener('input',render));render()</script></body></html>
