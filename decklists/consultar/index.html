<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consultar Decklist · CronoApp</title><style>body{background:#101827;color:#f2f5ff;font:16px system-ui;margin:0;line-height:1.5}main{max-width:760px;margin:auto;padding:24px}a{color:#c9c3ff}section{background:#1d2a40;border:1px solid #43516a;padding:22px;border-radius:16px;margin-top:22px}input,button{font:inherit;border-radius:10px;padding:12px}input{background:#101827;color:#fff;border:1px solid #71809a;min-width:0;flex:1;text-transform:uppercase}button{background:#7568f5;color:#fff;border:0;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #ffdc70;outline-offset:3px}.controls{display:flex;gap:10px;flex-wrap:wrap}.item{display:flex;align-items:center;gap:14px;border-bottom:1px solid #43516a;padding:10px 0}.item img{width:52px;border-radius:5px}.item span{flex:1}.muted{color:#c4cfe0}h1{margin-bottom:4px}@media(max-width:480px){main{padding:14px}section{padding:16px}}</style></head><body><main><a href="../">← Crear Decklist</a><h1>Consultar Decklist</h1><p class="muted">Revisa las 60 cartas de un oponente con el código que te compartió.</p><section><form id="form"><label for="code">Código de Decklist</label><div class="controls"><input id="code" autocomplete="off" placeholder="DK-XXXXXXXXXX" required><button type="submit">Consultar</button></div></form><p id="status" role="status" aria-live="polite"></p></section><section id="result" hidden><h2 id="player"></h2><p id="total"></p><div id="cards"></div></section></main><script src="../catalog-m6.js?v=20261102-energyart-v4"></script><script>const $=id=>document.getElementById(id),base='https://cronoapp-97aa6-default-rtdb.firebaseio.com/sharedDecklists/';const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function canonicalBasicArt(c){
 if(c.category!=='energy')return '';
 const name=String(c.name||'').normalize('NFD').replace(/\p{M}/gu,'').toLowerCase().trim();
 const basic=window.CronoM6?.basicEnergies?.find(e=>[e.name,...e.altNames].some(alias=>alias.normalize('NFD').replace(/\p{M}/gu,'').toLowerCase().trim()===name));
 return basic?.image||'';
}
function basicAlternates(c){
 if(c.category!=='energy')return [];
 const normalize=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
 const name=normalize(c.name);
 return window.CronoM6?.basicEnergies?.find(e=>[e.name,...e.altNames].some(alias=>normalize(alias)===name))?.imageAlternates||[];
}function imageUrl(value){if(!value)return '';if(/^data:/.test(value))return value;return /\.(png|jpe?g|webp)(?:\?|$)/i.test(value)?value:String(value).replace(/\/$/,'')+'/low.webp'}function fallback(c){const svg='<svg xmlns="http://www.w3.org/2000/svg" width="120" height="168"><rect width="120" height="168" rx="8" fill="#314461"/><text x="60" y="80" fill="#fff" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">Imagen no</text><text x="60" y="96" fill="#fff" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">disponible</text></svg>';return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}document.addEventListener('error',e=>{const img=e.target;if(!(img instanceof HTMLImageElement))return;const urls=(img.dataset.altSources||'').split('|').filter(Boolean),i=Number(img.dataset.altIndex||0);if(i<urls.length){img.dataset.altIndex=String(i+1);img.src=urls[i];return}if(img.dataset.fallback&&img.src!==img.dataset.fallback)img.src=img.dataset.fallback},true);async function lookup(raw){const code=raw.trim().toUpperCase();$('result').hidden=true;if(!/^DK-[A-Z0-9]{7,10}$/.test(code)){$('status').textContent='Revisa el código e inténtalo nuevamente.';return}$('status').textContent='Buscando Decklist…';try{const r=await fetch(base+encodeURIComponent(code)+'.json');if(!r.ok)throw Error('No se pudo consultar Firebase.');const d=await r.json();if(!d||d.active!==true)throw Error('No encontramos una Decklist compartida con ese código.');const cards=Object.values(d.cards||{});$('player').textContent=d.player||d.name||'Decklist';$('total').textContent=cards.reduce((n,c)=>n+Number(c.quantity||0),0)+' cartas';$('cards').innerHTML=[['pokemon','Pokémon'],['trainer','Entrenadores'],['energy','Energías']].map(([category,label])=>{const group=cards.filter(c=>c.category===category);if(!group.length)return '';return '<h3>'+label+' ('+group.reduce((n,c)=>n+Number(c.quantity||0),0)+')</h3>'+group.map(c=>'<div class="item"><img loading="lazy" referrerpolicy="no-referrer" alt="Carta '+safe(c.name)+'" data-fallback="'+safe(fallback(c))+'" data-alt-sources="'+safe(basicAlternates(c).join('|'))+'" data-alt-index="0" src="'+safe(imageUrl(canonicalBasicArt(c)||c.image)||fallback(c))+'"><span><strong>'+safe(c.name)+'</strong><div class="muted">'+safe(c.set||'')+'</div></span><b>'+Number(c.quantity||0)+'×</b></div>').join('')}).join('');$('result').hidden=false;$('status').textContent='Decklist encontrada.'}catch(e){$('status').textContent=e.message}}$('form').addEventListener('submit',e=>{e.preventDefault();lookup($('code').value)});const q=new URLSearchParams(location.search).get('list');if(q){$('code').value=q;lookup(q)}</script></body></html>
