<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16191d">
  <title>Agenda de Temuco · Cronoapp</title>
  <style>
    :root { color-scheme: dark; --bg:#14171b; --surface:#20252b; --raised:#293039; --edge:#46515d; --text:#f0f2f5; --muted:#bfc7d0; --accent:#a4b3c1; --focus:#dce7f2; --danger:#ffb4ab; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(circle at 10% 0%,#2b333b,var(--bg) 45%); color:var(--text); min-height:100dvh; }
    a { color:inherit; }
    button, input, select { font:inherit; }
    button, select { cursor:pointer; }
    :focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
    [hidden] { display:none !important; }
    .shell { max-width:1100px; margin:0 auto; padding:24px clamp(18px,4vw,48px) 80px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .brand { font-size:18px; font-weight:900; letter-spacing:-.035em; text-decoration:none; }
    .back { display:inline-flex; align-items:center; min-height:42px; padding:0 14px; border:1px solid var(--edge); border-radius:10px; color:var(--muted); text-decoration:none; font-size:14px; font-weight:700; }
    .back:hover { color:var(--text); border-color:var(--accent); }
    .intro { margin:clamp(42px,7vw,82px) 0 32px; }
    .eyebrow { color:var(--accent); font-size:12px; font-weight:900; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:10px 0 12px; font-size:clamp(36px,6vw,64px); letter-spacing:-.055em; line-height:1.03; }
    .intro p { max-width:610px; margin:0; color:var(--muted); font-size:clamp(15px,2vw,18px); line-height:1.55; }
    .filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:28px; }
    .filters button { min-height:40px; padding:0 15px; border:1px solid var(--edge); border-radius:100px; background:var(--surface); color:var(--text); font-size:13px; font-weight:750; }
    .filters button[aria-pressed="true"] { border-color:var(--accent); background:var(--focus); color:#182129; }
    .store { margin:0 0 38px; }
    .store-head { display:flex; align-items:baseline; gap:12px; margin-bottom:14px; border-bottom:1px solid var(--edge); padding-bottom:11px; }
    .store h2 { margin:0; font-size:clamp(22px,3vw,28px); letter-spacing:-.03em; }
    .store-count { color:var(--muted); font-size:13px; }
    .events { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr)); gap:12px; }
    .event { display:grid; grid-template-columns:62px minmax(0,1fr); gap:14px; padding:18px; border:1px solid var(--edge); border-radius:15px; background:var(--surface); }
    .event.past { opacity:.64; }
    .date-box { display:flex; flex-direction:column; align-items:center; justify-content:center; align-self:start; min-height:64px; border-radius:10px; background:var(--raised); text-transform:uppercase; }
    .date-box strong { font-size:25px; line-height:1; }
    .date-box span { margin-top:5px; color:var(--muted); font-size:11px; font-weight:800; letter-spacing:.07em; }
    .event h3 { margin:0 0 7px; font-size:18px; line-height:1.3; }
    .event p { margin:5px 0; color:var(--muted); font-size:13px; line-height:1.5; }
    .event .event-time { color:var(--text); font-weight:750; }
    .event-actions { display:flex; gap:12px; margin-top:12px; }
    .event-actions button { padding:5px 0; border:0; background:transparent; color:var(--focus); font-size:13px; font-weight:700; }
    .event-actions .delete { color:var(--danger); }
    .empty { padding:26px; border:1px dashed var(--edge); border-radius:14px; color:var(--muted); }
    .status { min-height:22px; color:var(--muted); font-size:14px; }
    .admin { max-width:720px; margin:58px 0 0; padding:clamp(18px,3vw,28px); border:1px solid var(--edge); border-radius:18px; background:var(--surface); }
    .admin h2 { margin:0 0 7px; font-size:24px; }
    .admin > p { color:var(--muted); font-size:14px; line-height:1.5; }
    .admin form { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .field { display:flex; flex-direction:column; gap:6px; min-width:0; }
    .field label { font-size:13px; font-weight:750; }
    .field input, .field select { width:100%; min-height:44px; padding:8px 10px; border:1px solid var(--edge); border-radius:9px; background:var(--raised); color:var(--text); }
    .full { grid-column:1 / -1; }
    .form-actions { display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin-top:5px; }
    .primary, .secondary { min-height:42px; padding:0 16px; border-radius:9px; font-weight:750; }
    .primary { border:1px solid var(--focus); background:var(--focus); color:#162029; }
    .secondary { border:1px solid var(--edge); background:var(--raised); color:var(--text); }
    .primary:disabled { opacity:.55; cursor:wait; }
    @media (max-width:580px) { .admin form { grid-template-columns:1fr; } .full { grid-column:auto; } .back { padding:0 10px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header><a class="brand" href="/">Cronoapp</a><a class="back" href="/" data-i18n="back">Volver al inicio</a></header>
    <div class="intro"><span class="eyebrow" data-i18n="eyebrow">JUEGA EN TEMUCO</span><h1 data-i18n="title">Agenda de eventos</h1><p data-i18n="description">Torneos y horarios de juego libre en las tiendas de Temuco. Selecciona una tienda para ver su programación.</p></div>
    <nav class="filters" aria-label="Filtrar por tienda"><button type="button" data-store="all" aria-pressed="true" data-i18n="all">Todas las tiendas</button><button type="button" data-store="trizano">Top8 Trizano</button><button type="button" data-store="neruda">Top8 Neruda</button><button type="button" data-store="bluecard">Bluecard</button></nav>
    <nav class="filters" aria-label="Filtrar por fecha"><button type="button" data-period="all" aria-pressed="true" data-i18n="allDates">Todas las fechas</button><button type="button" data-period="week" aria-pressed="false" data-i18n="thisWeek">Esta semana</button><button type="button" data-period="month" aria-pressed="false" data-i18n="thisMonth">Este mes</button><button type="button" data-period="quarter" aria-pressed="false" data-i18n="thisQuarter">Este trimestre</button></nav>
    <p id="listStatus" class="status" role="status" data-i18n="loading">Cargando agenda…</p>
    <div id="storeList"></div>

      <h2 id="adminTitle" data-i18n="adminTitle">Administrar agenda</h2>

      <button id="signIn" class="primary" type="button" data-i18n="google">Ingresar con Google</button>
      <button id="signOut" class="secondary" type="button" hidden data-i18n="signOut">Cerrar sesión</button>
      <form id="eventForm" hidden>
        <div class="field"><label for="store" data-i18n="store">Tienda</label><select id="store" required><option value="trizano">Top8 Trizano</option><option value="neruda">Top8 Neruda</option><option value="bluecard">Bluecard</option></select></div>
        <div class="field"><label for="kind" data-i18n="kind">Actividad</label><select id="kind" required><option value="tournament" data-i18n="tournament">Torneo</option><option value="free" data-i18n="free">Juego libre</option></select></div>
        <div class="field tournament-field"><label for="eventType" data-i18n="eventType">Tipo de torneo</label><select id="eventType"><option>Torneo Casual</option><option>League Challenge</option><option>League Cup</option><option value="Abacaxi Showdown" data-neruda-only hidden disabled>Abacaxi Showdown</option></select></div>
        <div class="field tournament-field"><label for="format" data-i18n="format">Formato</label><select id="format"><option>Rondas Suizas Bo1</option><option>Rondas Suizas Bo3</option></select></div>
        <div class="field tournament-field"><label for="value" data-i18n="value">Valor de inscripción (CLP)</label><input id="value" type="number" min="0" step="1" inputmode="numeric" required></div>
        <div class="field"><label for="date" data-i18n="date">Fecha</label><input id="date" type="date" required></div>
        <div class="field"><label for="time" data-i18n="time">Hora de inicio</label><input id="time" type="time" required></div>
        <div id="endField" class="field full" hidden><label for="endTime" data-i18n="endTime">Hora de término</label><input id="endTime" type="time"></div>
        <div class="form-actions full"><button id="submitEvent" class="primary" type="submit" data-i18n="publish">Publicar actividad</button><button id="cancelEdit" class="secondary" type="button" hidden data-i18n="cancel">Cancelar edición</button></div>
      </form>
      <p id="formStatus" class="status" role="status"></p>
    </section>
  </main>
  <script type="module">
    const firebaseConfig = {
      apiKey: 'AIzaSyDQpTvOLF-RqYZQJHe8cCk_0E8E5M5GkK8',
      authDomain: 'cronoapp-97aa6.firebaseapp.com',
      databaseURL: 'https://cronoapp-97aa6-default-rtdb.firebaseio.com',
      projectId: 'cronoapp-97aa6',
      appId: '1:482155443294:web:b62c46a3ae16ca551630cf'
    };
    const adminEmail = 'quidel.dsgn@gmail.com';
    const stores = { trizano: 'Top8 Trizano', neruda: 'Top8 Neruda', bluecard: 'Bluecard' };
    const messages = {
      es: { back:'Volver al inicio', eyebrow:'JUEGA EN TEMUCO', title:'Agenda de eventos', description:'Torneos y horarios de juego libre en las tiendas de Temuco. Selecciona una tienda para ver su programación.', all:'Todas las tiendas', allDates:'Todas las fechas', thisWeek:'Esta semana', thisMonth:'Este mes', thisQuarter:'Este trimestre', loading:'Cargando agenda…', empty:'No hay actividades publicadas para esta tienda.', unavailable:'No se pudo cargar la agenda.', adminTitle:'Administrar agenda', signIn:'Inicia sesión con tu cuenta de administración para publicar eventos.', google:'Ingresar con Google', signOut:'Cerrar sesión', store:'Tienda', kind:'Actividad', tournament:'Torneo', free:'Juego libre', eventType:'Tipo de torneo', format:'Formato', value:'Valor de inscripción (CLP)', date:'Fecha', time:'Hora de inicio', endTime:'Hora de término', publish:'Publicar actividad', update:'Guardar cambios', cancel:'Cancelar edición', edit:'Editar', delete:'Eliminar', deleteConfirm:'¿Eliminar esta actividad?', saved:'Actividad guardada.', removed:'Actividad eliminada.', saveError:'No se pudo guardar. Revisa las reglas de acceso de Firebase.', deleteError:'No se pudo eliminar la actividad.', denied:'Esta cuenta no tiene permiso para administrar la agenda.', welcome:'Puedes crear, editar y eliminar actividades.', authError:'No se pudo iniciar sesión con Google.', past:'Actividad pasada', count:'actividades', dateError:'Ingresa una fecha y hora válidas.', endError:'La hora de término debe ser posterior a la de inicio.' },
      en: { back:'Back to home', eyebrow:'PLAY IN TEMUCO', title:'Event schedule', description:'Tournaments and free play at Temuco stores. Choose a store to see its schedule.', all:'All stores', allDates:'All dates', thisWeek:'This week', thisMonth:'This month', thisQuarter:'This quarter', loading:'Loading schedule…', empty:'No activities have been published for this store.', unavailable:'Could not load the schedule.', adminTitle:'Manage schedule', signIn:'Sign in with your admin account to publish events.', google:'Sign in with Google', signOut:'Sign out', store:'Store', kind:'Activity', tournament:'Tournament', free:'Free play', eventType:'Tournament type', format:'Format', value:'Entry fee (CLP)', date:'Date', time:'Start time', endTime:'End time', publish:'Publish activity', update:'Save changes', cancel:'Cancel edit', edit:'Edit', delete:'Delete', deleteConfirm:'Delete this activity?', saved:'Activity saved.', removed:'Activity deleted.', saveError:'Could not save. Check the Firebase access rules.', deleteError:'Could not delete the activity.', denied:'This account cannot manage the schedule.', welcome:'You can create, edit and delete activities.', authError:'Could not sign in with Google.', past:'Past activity', count:'activities', dateError:'Enter a valid date and time.', endError:'End time must be later than start time.' },
      pt: { back:'Voltar ao início', eyebrow:'JOGUE EM TEMUCO', title:'Agenda de eventos', description:'Torneios e horários de jogo livre nas lojas de Temuco. Escolha uma loja para ver a programação.', all:'Todas as lojas', allDates:'Todas as datas', thisWeek:'Esta semana', thisMonth:'Este mês', thisQuarter:'Este trimestre', loading:'Carregando agenda…', empty:'Não há atividades publicadas para esta loja.', unavailable:'Não foi possível carregar a agenda.', adminTitle:'Administrar agenda', signIn:'Entre com sua conta de administração para publicar eventos.', google:'Entrar com Google', signOut:'Sair', store:'Loja', kind:'Atividade', tournament:'Torneio', free:'Jogo livre', eventType:'Tipo de torneio', format:'Formato', value:'Valor da inscrição (CLP)', date:'Data', time:'Hora de início', endTime:'Hora de término', publish:'Publicar atividade', update:'Salvar alterações', cancel:'Cancelar edição', edit:'Editar', delete:'Excluir', deleteConfirm:'Excluir esta atividade?', saved:'Atividade salva.', removed:'Atividade excluída.', saveError:'Não foi possível salvar. Verifique as regras de acesso do Firebase.', deleteError:'Não foi possível excluir a atividade.', denied:'Esta conta não pode administrar a agenda.', welcome:'Você pode criar, editar e excluir atividades.', authError:'Não foi possível entrar com Google.', past:'Atividade passada', count:'atividades', dateError:'Informe uma data e hora válidas.', endError:'A hora de término deve ser posterior à de início.' }
    };
    let language = 'es';
    try { const preference = localStorage.getItem('cronoapp-language'); if (messages[preference]) language = preference; } catch (_) {}
    document.documentElement.lang = language;
    document.querySelectorAll('[data-i18n]').forEach(node => { node.textContent = messages[language][node.dataset.i18n]; });
    const t = key => messages[language][key];
    const locale = { es:'es-CL', en:'en-US', pt:'pt-BR' }[language];
    const list = document.getElementById('storeList');
    const listStatus = document.getElementById('listStatus');
    const form = document.getElementById('eventForm');
    const formStatus = document.getElementById('formStatus');
    let events = {};
    let activeStore = 'all';
    let activePeriod = 'all';
    let editingId = null;
    let isAdmin = false;
    let database, eventsRef, auth;

    function validEvent(event) {
      return event && Object.hasOwn(stores, event.store) && ['tournament','free'].includes(event.kind)
        && /^\d{4}-\d{2}-\d{2}$/.test(event.date || '') && /^\d{2}:\d{2}$/.test(event.time || '')
        && (!event.endTime || /^\d{2}:\d{2}$/.test(event.endTime))
        && (event.kind === 'free' || ((['Torneo Casual','League Challenge','League Cup'].includes(event.type) || (event.type === 'Abacaxi Showdown' && event.store === 'neruda')) && ['Rondas Suizas Bo1','Rondas Suizas Bo3'].includes(event.format) && Number.isSafeInteger(event.value) && event.value >= 0));
    }
    function element(tag, className, value) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (value != null) node.textContent = value;
      return node;
    }
    function displayDate(date) {
      const [year, month, day] = date.split('-').map(Number);
      return new Intl.DateTimeFormat(locale, { weekday:'long', day:'numeric', month:'long', year:'numeric', timeZone:'America/Santiago' }).format(new Date(Date.UTC(year, month - 1, day, 12)));
    }
    function periodBounds(period) {
      if (period === 'all') return null;
      const parts = new Intl.DateTimeFormat('en-CA', { timeZone:'America/Santiago', year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(new Date());
      const today = Object.fromEntries(parts.map(part => [part.type, part.value]));
      const date = new Date(Date.UTC(Number(today.year), Number(today.month) - 1, Number(today.day)));
      let start, end;
      if (period === 'week') {
        const day = (date.getUTCDay() + 6) % 7;
        start = new Date(date); start.setUTCDate(date.getUTCDate() - day);
        end = new Date(start); end.setUTCDate(start.getUTCDate() + 6);
      } else if (period === 'month') {
        start = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), 1));
        end = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth() + 1, 0));
      } else {
        const quarterStart = Math.floor(date.getUTCMonth() / 3) * 3;
        start = new Date(Date.UTC(date.getUTCFullYear(), quarterStart, 1));
        end = new Date(Date.UTC(date.getUTCFullYear(), quarterStart + 3, 0));
      }
      const iso = value => value.toISOString().slice(0,10);
      return [iso(start), iso(end)];
    }
    function render() {
      list.replaceChildren();
      const bounds = periodBounds(activePeriod);
      const now = new Intl.DateTimeFormat('sv-SE', { timeZone:'America/Santiago', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23' }).format(new Date()).replace(' ', 'T');
      for (const [storeId, storeName] of Object.entries(stores)) {
        if (activeStore !== 'all' && activeStore !== storeId) continue;
        const entries = Object.entries(events).filter(([, event]) => validEvent(event) && event.store === storeId && (!bounds || (event.date >= bounds[0] && event.date <= bounds[1])))
          .sort((a,b) => (a[1].date + a[1].time).localeCompare(b[1].date + b[1].time));
        const section = element('section','store');
        section.setAttribute('aria-label', storeName);
        const heading = element('div','store-head');
        heading.append(element('h2','',storeName), element('span','store-count',`${entries.length} ${t('count')}`));
        section.append(heading);
        if (!entries.length) section.append(element('p','empty',t('empty')));
        else {
          const cards = element('div','events');
          for (const [id,event] of entries) {
            const card = element('article','event');
            if (`${event.date}T${event.time}` < now) card.classList.add('past');
            const dateBox = element('div','date-box');
            const [year, month, day] = event.date.split('-').map(Number);
            const monthName = new Intl.DateTimeFormat(locale, { month:'short', timeZone:'America/Santiago' }).format(new Date(Date.UTC(year, month - 1, day, 12)));
            dateBox.append(element('strong','',String(day)),element('span','',monthName));
            const body = element('div','event-body');
            body.append(element('h3','',event.kind === 'free' ? t('free') : event.type),element('p','event-time',`${displayDate(event.date)} · ${event.time}${event.endTime ? `–${event.endTime}` : ''}`));
            if (event.kind === 'tournament') { body.append(element('p','',event.format)); body.append(element('p','',`${new Intl.NumberFormat(locale,{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(event.value)}`)); }
            if (card.classList.contains('past')) body.append(element('p','',t('past')));
            if (isAdmin) {
              const actions = element('div','event-actions');
              const edit = element('button','',t('edit'));
              edit.type = 'button'; edit.addEventListener('click', () => editEvent(id));
              const removeButton = element('button','delete',t('delete'));
              removeButton.type = 'button'; removeButton.addEventListener('click', () => deleteEvent(id));
              actions.append(edit, removeButton); body.append(actions);
            }
            card.append(dateBox, body); cards.append(card);
          }
          section.append(cards);
        }
        list.append(section);
      }
    }
    document.querySelectorAll('[data-period]').forEach(button => button.addEventListener('click', () => {
      activePeriod = button.dataset.period;
      document.querySelectorAll('[data-period]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      render();
    }));
    document.querySelectorAll('.filters button[data-store]').forEach(button => button.addEventListener('click', () => {
      activeStore = button.dataset.store;
      document.querySelectorAll('.filters button').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      render();
    }));
    function syncKind() {
      const free = document.getElementById('kind').value === 'free';
      document.getElementById('value').required = !free;
      document.getElementById('value').disabled = free;
      document.querySelectorAll('.tournament-field').forEach(field => { field.hidden = free; field.querySelector('select').disabled = free; });
      document.getElementById('endField').hidden = !free;
      document.getElementById('endTime').required = free;
    }
    document.getElementById('kind').addEventListener('change', syncKind);
    function syncStoreType() {
      const option = document.querySelector('[data-neruda-only]');
      const allowed = document.getElementById('store').value === 'neruda';
      option.hidden = !allowed; option.disabled = !allowed;
      if (!allowed && document.getElementById('eventType').value === option.value) document.getElementById('eventType').value = 'Torneo Casual';
    }
    document.getElementById('store').addEventListener('change', syncStoreType);
    function resetForm() {
      editingId = null; form.reset(); syncKind(); syncStoreType();
      document.getElementById('submitEvent').textContent = t('publish');
      document.getElementById('cancelEdit').hidden = true;
    }
    document.getElementById('cancelEdit').addEventListener('click', resetForm);
    function editEvent(id) {
      if (!isAdmin || !validEvent(events[id])) return;
      const event = events[id];
      editingId = id;
      for (const key of ['store','kind','date','time','endTime','value']) document.getElementById(key).value = event[key] || '';
      syncStoreType();
      document.getElementById('eventType').value = event.type || 'Torneo Casual';
      document.getElementById('format').value = event.format || 'Rondas Suizas Bo1';
      syncKind();
      document.getElementById('submitEvent').textContent = t('update');
      document.getElementById('cancelEdit').hidden = false;
      document.getElementById('admin').scrollIntoView({ behavior:'smooth' });
      document.getElementById('store').focus();
    }
    function collectEvent() {
      const kind = document.getElementById('kind').value;
      const event = { store:document.getElementById('store').value, kind, date:document.getElementById('date').value, time:document.getElementById('time').value };
      if (kind === 'free') event.endTime = document.getElementById('endTime').value;
      else { event.type = document.getElementById('eventType').value; event.format = document.getElementById('format').value; event.value = Number(document.getElementById('value').value); }
      return event;
    }
    async function deleteEvent(id) {
      if (!isAdmin || !events[id] || !confirm(t('deleteConfirm'))) return;
      try { await database.remove(database.child(eventsRef,id)); if (editingId === id) resetForm(); formStatus.textContent = t('removed'); }
      catch { formStatus.textContent = t('deleteError'); }
    }
    form.addEventListener('submit', async e => {
      e.preventDefault();
      if (!isAdmin || !auth.currentUser || !form.reportValidity()) return;
      const event = collectEvent();
      const instant = new Date(`${event.date}T${event.time}:00`);
      if (!validEvent(event) || Number.isNaN(instant.getTime()) || instant.getFullYear() !== Number(event.date.slice(0,4)) || instant.getMonth() + 1 !== Number(event.date.slice(5,7)) || instant.getDate() !== Number(event.date.slice(8,10))) { formStatus.textContent = t('dateError'); return; }
      if (event.kind === 'free' && event.endTime <= event.time) { formStatus.textContent = t('endError'); return; }
      if (event.kind === 'tournament' && (!Number.isSafeInteger(event.value) || event.value < 0)) { document.getElementById('value').focus(); return; }
      const button = document.getElementById('submitEvent');
      button.disabled = true; formStatus.textContent = '';
      try {
        await database.set(editingId ? database.child(eventsRef,editingId) : database.push(eventsRef),event);
        resetForm(); formStatus.textContent = t('saved');
      } catch { formStatus.textContent = t('saveError'); }
      finally { button.disabled = false; }
    });

    try {
      const base = 'https://www.gstatic.com/firebasejs/12.19.0/';
      const [{initializeApp},dbModule] = await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-database.js')]);
      database = dbModule;
      const app = initializeApp(firebaseConfig);
      eventsRef = dbModule.ref(dbModule.getDatabase(app),'agenda/events');
      dbModule.onValue(eventsRef, snapshot => { events = snapshot.val() || {}; listStatus.textContent = ''; render(); }, () => { listStatus.textContent = t('unavailable'); });
      if (new URLSearchParams(location.search).has('admin')) {
        const admin = document.getElementById('admin'); admin.hidden = false;
        const { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } = await import(base+'firebase-auth.js');
        auth = getAuth(app);
        const signInButton = document.getElementById('signIn'), signOutButton = document.getElementById('signOut');
        onAuthStateChanged(auth,user => {
          isAdmin = Boolean(user && user.emailVerified && user.email?.toLowerCase() === adminEmail && user.providerData.some(provider => provider.providerId === 'google.com'));
          form.hidden = !isAdmin;
          signInButton.hidden = Boolean(user);
          signOutButton.hidden = !user;
          document.getElementById('authStatus').textContent = user ? t(isAdmin ? 'welcome' : 'denied') : t('signIn');
          if (!isAdmin) resetForm();
          render();
        });
        signInButton.addEventListener('click', async () => {
          try { await signInWithPopup(auth,new GoogleAuthProvider()); }
          catch { document.getElementById('authStatus').textContent = t('authError'); }
        });
        signOutButton.addEventListener('click', async () => { await signOut(auth); });
      }
    } catch { listStatus.textContent = t('unavailable'); }
  </script>
</body>
</html>
