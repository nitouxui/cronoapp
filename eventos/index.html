<!doctype html>
<html lang="es">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16191d">
  <title>Agenda de Temuco · Cronoapp</title>
  <style>
    :root { color-scheme: dark; --bg:#14171b; --surface:#20252b; --raised:#293039; --edge:#46515d; --text:#f0f2f5; --muted:#bfc7d0; --accent:#a4b3c1; --focus:#dce7f2; --danger:#ffb4ab; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(circle at 10% 0%,#2b333b,var(--bg) 45%); color:var(--text); min-height:100dvh; }
    a { color:inherit; }
    button, input, select { font:inherit; }
    button, select { cursor:pointer; }
    :focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
    [hidden] { display:none !important; }
    .shell { max-width:1100px; margin:0 auto; padding:24px clamp(18px,4vw,48px) 80px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .brand { font-size:18px; font-weight:900; letter-spacing:-.035em; text-decoration:none; }
    .back { display:inline-flex; align-items:center; min-height:42px; padding:0 14px; border:1px solid var(--edge); border-radius:10px; color:var(--muted); text-decoration:none; font-size:14px; font-weight:700; }
    .back:hover { color:var(--text); border-color:var(--accent); }
    .intro { margin:clamp(42px,7vw,82px) 0 32px; }
    .eyebrow { color:var(--accent); font-size:12px; font-weight:900; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:10px 0 12px; font-size:clamp(36px,6vw,64px); letter-spacing:-.055em; line-height:1.03; }
    .intro p { max-width:610px; margin:0; color:var(--muted); font-size:clamp(15px,2vw,18px); line-height:1.55; }
    .filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:28px; }
    .filters button { min-height:40px; padding:0 15px; border:1px solid var(--edge); border-radius:100px; background:var(--surface); color:var(--text); font-size:13px; font-weight:750; }
    .filters button[aria-pressed="true"] { border-color:var(--accent); background:var(--focus); color:#182129; }
    #storeList { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); align-items:stretch; gap:18px; }
    .store { display:flex; flex-direction:column; margin:0; min-width:0; }
    .events { display:flex; flex:1; flex-direction:column; gap:12px; }
    .store-head { display:grid; grid-template-columns:72px minmax(0,1fr); grid-template-areas:'logo name' 'logo address'; align-items:center; column-gap:12px; row-gap:4px; margin-bottom:14px; border-bottom:1px solid var(--edge); padding-bottom:11px; }
    .store-logo { grid-area:logo; width:72px; height:46px; align-self:center; object-fit:contain; }
    .store-address { grid-area:address; color:var(--muted); font-size:12px; line-height:1.35; }
    .store h2 { margin:0; font-size:clamp(22px,3vw,28px); letter-spacing:-.03em; }
    .store-count { color:var(--muted); font-size:13px; }
    .events { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr)); gap:12px; }
    .event { display:grid; flex:1 1 0; grid-template-columns:72px minmax(0,1fr); gap:14px; padding:30px 18px; border:1px solid var(--edge); border-radius:15px; background:var(--surface); }
    .event.past { opacity:.64; }
    .date-box { display:flex; box-sizing:border-box; width:72px; aspect-ratio:1; flex-direction:column; align-items:center; justify-content:center; align-self:start; min-height:0; padding:0; border-radius:10px; background:var(--raised); text-transform:uppercase; }
    .date-box strong { font-size:25px; line-height:1; }
    .date-box span { margin-top:5px; color:var(--muted); font-size:11px; font-weight:800; letter-spacing:.07em; }
    .date-box .weekday { margin:0 0 4px; font-size:10px; }
    .event h3 { margin:0 0 7px; font-size:18px; line-height:1.3; }
    .event p { margin:5px 0; color:var(--muted); font-size:13px; line-height:1.5; }
    .event .event-time { color:var(--text); font-weight:750; }
    .event-entry + .event-entry { margin-top:14px; padding-top:14px; border-top:1px solid var(--edge); }
    #tablesNoticeField .toggle { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:14px; }
    #tablesNoticeField input { width:20px; min-height:20px; accent-color:var(--focus); }
    .event-actions { display:flex; gap:12px; margin-top:12px; }
    .event-actions button { padding:5px 0; border:0; background:transparent; color:var(--focus); font-size:13px; font-weight:700; }
    .event-actions .delete { color:var(--danger); }
    .empty { padding:26px; border:1px dashed var(--edge); border-radius:14px; color:var(--muted); }
    .status { min-height:22px; color:var(--muted); font-size:14px; }
    .admin { max-width:720px; margin:58px 0 0; padding:clamp(18px,3vw,28px); border:1px solid var(--edge); border-radius:18px; background:var(--surface); }
    .admin h2 { margin:0 0 7px; font-size:24px; }
    .admin > p { color:var(--muted); font-size:14px; line-height:1.5; }
    .admin form { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .field { display:flex; flex-direction:column; gap:6px; min-width:0; }
    .field label { font-size:13px; font-weight:750; }
    .field input, .field select { width:100%; min-height:44px; padding:8px 10px; border:1px solid var(--edge); border-radius:9px; background:var(--raised); color:var(--text); }
    .full { grid-column:1 / -1; }
    .form-actions { display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin-top:5px; }
    .primary, .secondary { min-height:42px; padding:0 16px; border-radius:9px; font-weight:750; }
    .primary { border:1px solid var(--focus); background:var(--focus); color:#162029; }
    .secondary { border:1px solid var(--edge); background:var(--raised); color:var(--text); }
    .primary:disabled { opacity:.55; cursor:wait; }
    @media (max-width:900px) { #storeList { grid-template-columns:repeat(2,minmax(0,1fr)) !important; } }
    @media (max-width:580px) { #storeList { grid-template-columns:1fr !important; } .admin form { grid-template-columns:1fr; } .full { grid-column:auto; } .back { padding:0 10px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header><a class="brand" href="/">Cronoapp</a><a class="back" href="/" data-i18n="back">Volver al inicio</a></header>
    <div class="intro"><span class="eyebrow" data-i18n="eyebrow">JUEGA EN TEMUCO</span><h1 data-i18n="title">Agenda de eventos semanal</h1></div>
    
        <p id="listStatus" class="status" role="status" data-i18n="loading">Cargando agenda…</p>
    <div id="storeList"></div>
    <section id="admin" class="admin" aria-labelledby="adminTitle" hidden>
      <h2 id="adminTitle" data-i18n="adminTitle">Administrar agenda</h2>
      <p id="authStatus" role="status" data-i18n="signIn">Inicia sesión con tu cuenta de administración para publicar eventos.</p>
      <button id="signIn" class="primary" type="button" data-i18n="google">Ingresar con Google</button>
      <button id="signOut" class="secondary" type="button" hidden data-i18n="signOut">Cerrar sesión</button>
      <form id="eventForm" hidden>
        <div class="field"><label for="store" data-i18n="store">Tienda</label><select id="store" required><option value="trizano">Top8 Trizano</option><option value="neruda">Top8 Neruda</option><option value="bluecard">Bluecard</option></select></div>
        <div class="field"><label for="kind" data-i18n="kind">Actividad</label><select id="kind" required><option value="tournament" data-i18n="tournament">Torneo</option><option value="free" data-i18n="free">Juego libre</option></select></div>
        <div class="field tournament-field"><label for="eventType" data-i18n="eventType">Tipo de torneo</label><select id="eventType"><option>Torneo Casual</option><option>League Challenge</option><option>League Cup</option><option value="Abacaxi Showdown" data-neruda-only hidden disabled>Abacaxi Showdown</option></select></div>
        <div class="field tournament-field"><label for="format" data-i18n="format">Formato</label><select id="format"><option>Rondas Suizas Bo1</option><option>Rondas Suizas Bo3</option></select></div>
        <div class="field tournament-field"><label for="entryType" data-i18n="entryType">Costo de participación</label><select id="entryType" required><option value="amount" data-i18n="amountOption">Valor</option><option value="free" data-i18n="freeEntry">Gratis</option><option value="beverage" data-i18n="beverageEntry">Consumo de bebestible en tienda</option></select></div>
        <div id="valueField" class="field" hidden><label for="value" data-i18n="value">Valor (CLP)</label><input id="value" type="number" min="0" step="1" inputmode="numeric"></div>
        <div class="field"><label for="date" data-i18n="date">Fecha</label><input id="date" type="date" required></div>
        <div class="field"><label for="time" data-i18n="time">Hora de inicio</label><input id="time" type="time" required></div>
        <div id="endField" class="field full" hidden><label for="endTime" data-i18n="endTime">Hora de término</label><input id="endTime" type="time"></div>
        <div id="tablesNoticeField" class="field full" hidden><label class="toggle"><input id="tablesNotice" type="checkbox"><span data-i18n="tableNotice">Mostrar aviso: sujeto a disponibilidad de mesas</span></label></div>
        <div class="form-actions full"><button id="submitEvent" class="primary" type="submit" data-i18n="publish">Publicar actividad</button><button id="cancelEdit" class="secondary" type="button" hidden data-i18n="cancel">Cancelar edición</button></div>
      </form>
      <p id="formStatus" class="status" role="status"></p>
    </section>
  </main>
  <script type="module">
    const firebaseConfig = {
      apiKey: 'AIzaSyDQpTvOLF-RqYZQJHe8cCk_0E8E5M5GkK8',
      authDomain: 'cronoapp-97aa6.firebaseapp.com',
      databaseURL: 'https://cronoapp-97aa6-default-rtdb.firebaseio.com',
      projectId: 'cronoapp-97aa6',
      appId: '1:482155443294:web:b62c46a3ae16ca551630cf'
    };
    const adminEmail = 'quidel.dsgn@gmail.com';
    const stores = { trizano: 'Top8 Trizano', neruda: 'Top8 Neruda', bluecard: 'Bluecard' };
    const storeAddresses = { neruda:'Avenida Pablo Neruda 1980', trizano:'Trizano 430', bluecard:'Lago Riñihue 01890' };
    const storeLogos = { trizano:'assets/logos/top8.svg', neruda:'assets/logos/top8.svg', bluecard:'assets/logos/bluecard.svg' };
    const messages = {
      es: { back:'Volver al inicio', eyebrow:'JUEGA EN TEMUCO', title:'Agenda de eventos semanal', all:'Todas las tiendas', loading:'Cargando agenda…', empty:'No hay actividades publicadas para esta tienda.', unavailable:'No se pudo cargar la agenda.', adminTitle:'Administrar agenda', signIn:'Inicia sesión con tu cuenta de administración para publicar eventos.', google:'Ingresar con Google', signOut:'Cerrar sesión', store:'Tienda', kind:'Actividad', tournament:'Torneo', free:'Juego libre', eventType:'Tipo de torneo', format:'Formato', entryType:'Costo de participación', amountOption:'Valor', beverageEntry:'Consumo de bebestible en tienda', value:'Valor (CLP)', date:'Fecha', time:'Hora de inicio', endTime:'Hora de término', publish:'Publicar actividad', update:'Guardar cambios', cancel:'Cancelar edición', edit:'Editar', delete:'Eliminar', deleteConfirm:'¿Eliminar esta actividad?', saved:'Actividad guardada.', removed:'Actividad eliminada.', saveError:'No se pudo guardar. Revisa las reglas de acceso de Firebase.', deleteError:'No se pudo eliminar la actividad.', denied:'Esta cuenta no tiene permiso para administrar la agenda.', welcome:'Puedes crear, editar y eliminar actividades.', authError:'No se pudo iniciar sesión con Google.', past:'Actividad pasada', count:'actividades', dateError:'Ingresa una fecha y hora válidas.', endError:'La hora de término debe ser posterior a la de inicio.', freeEntry:'Gratis', tableNotice:'Mostrar aviso: sujeto a disponibilidad de mesas', tableNoticePublic:'Sujeto a disponibilidad de mesas' },
      en: { back:'Back to home', eyebrow:'PLAY IN TEMUCO', title:'Weekly event schedule', all:'All stores', loading:'Loading schedule…', empty:'No activities have been published for this store.', unavailable:'Could not load the schedule.', adminTitle:'Manage schedule', signIn:'Sign in with your admin account to publish events.', google:'Sign in with Google', signOut:'Sign out', store:'Store', kind:'Activity', tournament:'Tournament', free:'Free play', eventType:'Tournament type', format:'Format', entryType:'Entry cost', amountOption:'Price', beverageEntry:'Purchase a drink at the store', value:'Amount (CLP)', date:'Date', time:'Start time', endTime:'End time', publish:'Publish activity', update:'Save changes', cancel:'Cancel edit', edit:'Edit', delete:'Delete', deleteConfirm:'Delete this activity?', saved:'Activity saved.', removed:'Activity deleted.', saveError:'Could not save. Check the Firebase access rules.', deleteError:'Could not delete the activity.', denied:'This account cannot manage the schedule.', welcome:'You can create, edit and delete activities.', authError:'Could not sign in with Google.', past:'Past activity', count:'activities', dateError:'Enter a valid date and time.', endError:'End time must be later than start time.', freeEntry:'Free', tableNotice:'Show notice: subject to table availability', tableNoticePublic:'Subject to table availability' },
      pt: { back:'Voltar ao início', eyebrow:'JOGUE EM TEMUCO', title:'Agenda semanal de eventos', all:'Todas as lojas', loading:'Carregando agenda…', empty:'Não há atividades publicadas para esta loja.', unavailable:'Não foi possível carregar a agenda.', adminTitle:'Administrar agenda', signIn:'Entre com sua conta de administração para publicar eventos.', google:'Entrar com Google', signOut:'Sair', store:'Loja', kind:'Atividade', tournament:'Torneio', free:'Jogo livre', eventType:'Tipo de torneio', format:'Formato', entryType:'Custo de participação', amountOption:'Valor', beverageEntry:'Consumo de bebida na loja', value:'Valor (CLP)', date:'Data', time:'Hora de início', endTime:'Hora de término', publish:'Publicar atividade', update:'Salvar alterações', cancel:'Cancelar edição', edit:'Editar', delete:'Excluir', deleteConfirm:'Excluir esta atividade?', saved:'Atividade salva.', removed:'Atividade excluída.', saveError:'Não foi possível salvar. Verifique as regras de acesso do Firebase.', deleteError:'Não foi possível excluir a atividade.', denied:'Esta conta não pode administrar a agenda.', welcome:'Você pode criar, editar e excluir atividades.', authError:'Não foi possível entrar com Google.', past:'Atividade passada', count:'atividades', dateError:'Informe uma data e hora válidas.', endError:'A hora de término deve ser posterior à de início.', freeEntry:'Grátis', tableNotice:'Mostrar aviso: sujeito à disponibilidade de mesas', tableNoticePublic:'Sujeito à disponibilidade de mesas' }
    };
    let language = 'es';
    try { const preference = localStorage.getItem('cronoapp-language'); if (messages[preference]) language = preference; } catch (_) {}
    document.documentElement.lang = language;
    document.querySelectorAll('[data-i18n]').forEach(node => { node.textContent = messages[language][node.dataset.i18n]; });
    const t = key => messages[language][key];
    const locale = { es:'es-CL', en:'en-US', pt:'pt-BR' }[language];
    const list = document.getElementById('storeList');
    const listStatus = document.getElementById('listStatus');
    const form = document.getElementById('eventForm');
    const formStatus = document.getElementById('formStatus');
    let events = {};
    let editingId = null;
    let isAdmin = false;
    let database, eventsRef, auth;

    function entryTypeFor(event) {
      return ['free','amount','beverage'].includes(event.entryType)
        ? event.entryType
        : Number(event.value) > 0 ? 'amount' : 'free';
    }
    function validEvent(event) {
      if (!event || !Object.hasOwn(stores, event.store) || !['tournament','free'].includes(event.kind)
        || (event.entryType !== undefined && !['free','amount','beverage'].includes(event.entryType))
        || !/^\d{4}-\d{2}-\d{2}$/.test(event.date || '') || !/^\d{2}:\d{2}$/.test(event.time || '')
        || (event.endTime && !/^\d{2}:\d{2}$/.test(event.endTime))
        || (event.showTableAvailabilityNote !== undefined && typeof event.showTableAvailabilityNote !== 'boolean')) return false;
      const amountIsValid = Number.isSafeInteger(event.value) && event.value >= 0;
      if (event.kind === 'free') return (!event.endTime || /^\d{2}:\d{2}$/.test(event.endTime)) && (entryTypeFor(event) !== 'amount' || amountIsValid);
      return (['Torneo Casual','League Challenge','League Cup'].includes(event.type) || (event.type === 'Abacaxi Showdown' && event.store === 'neruda'))
        && ['Rondas Suizas Bo1','Rondas Suizas Bo3'].includes(event.format) && amountIsValid;
    }
    function element(tag, className, value) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (value != null) node.textContent = value;
      return node;
    }
    function render() {
      list.replaceChildren();
      const now = new Intl.DateTimeFormat('sv-SE', { timeZone:'America/Santiago', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23' }).format(new Date()).replace(' ', 'T');
      const visibleStores = Object.entries(stores);
      list.style.gridTemplateColumns = `repeat(${visibleStores.length}, minmax(0, 1fr))`;
      for (const [storeId, storeName] of visibleStores) {
        const entries = Object.entries(events).filter(([, event]) => validEvent(event) && event.store === storeId)
          .sort((a,b) => (a[1].date + a[1].time).localeCompare(b[1].date + b[1].time));
        const section = element('section','store');
        section.setAttribute('aria-label', storeName);
        const heading = element('div','store-head');
        const logo = element('img','store-logo');
        logo.src = storeLogos[storeId]; logo.alt = storeId === 'bluecard' ? 'Logo Bluecard' : 'Logo Top8 Gaming Center';
        heading.append(logo, element('h2','',storeName), element('span','store-address',storeAddresses[storeId]));
        section.append(heading);
        if (!entries.length) {
          const empty = element('p','empty',t('empty'));
          section.append(empty);
        } else {
          const grouped = new Map();
          for (const entry of entries) {
            if (!grouped.has(entry[1].date)) grouped.set(entry[1].date, []);
            grouped.get(entry[1].date).push(entry);
          }
          const cards = element('div','events');
          for (const [date, dayEntries] of grouped) {
            const card = element('article','event');
            const dateTimes = dayEntries.map(([,event]) => `${event.date}T${event.time}`);
            if (dateTimes.every(value => value < now)) card.classList.add('past');
            const dateBox = element('div','date-box');
            const [year, month, day] = date.split('-').map(Number);
            const monthName = new Intl.DateTimeFormat(locale, { month:'short', timeZone:'America/Santiago' }).format(new Date(Date.UTC(year, month - 1, day, 12)));
            const weekday = new Intl.DateTimeFormat(locale, { weekday:'short', timeZone:'America/Santiago' }).format(new Date(Date.UTC(year, month - 1, day, 12)));
            dateBox.append(element('span','weekday',weekday),element('strong','',String(day)),element('span','',monthName));
            const body = element('div','event-body');
            for (const [id,event] of dayEntries) {
              const item = element('div','event-entry');
              const isPast = `${event.date}T${event.time}` < now;
              item.append(element('h3','',event.kind === 'free' ? t('free') : event.type),element('p','event-time',`${event.time}${event.endTime ? `–${event.endTime}` : ''}`));
              if (event.kind === 'tournament') item.append(element('p','',event.format));
              if (event.kind === 'tournament') {
                const costType = entryTypeFor(event);
                const costText = costType === 'beverage' ? t('beverageEntry') : costType === 'amount' ? new Intl.NumberFormat(locale,{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(event.value) : t('freeEntry');
                item.append(element('p','event-entry-cost',costText));
              }
              if (event.kind === 'free' && event.showTableAvailabilityNote) item.append(element('p','',t('tableNoticePublic')));
              if (isPast) item.append(element('p','',t('past')));
              if (isAdmin) {
                const actions = element('div','event-actions');
                const edit = element('button','',t('edit'));
                edit.type = 'button'; edit.addEventListener('click', () => editEvent(id));
                const removeButton = element('button','delete',t('delete'));
                removeButton.type = 'button'; removeButton.addEventListener('click', () => deleteEvent(id));
                actions.append(edit, removeButton); item.append(actions);
              }
              body.append(item);
            }
            card.append(dateBox, body);
            cards.append(card);
          }
          section.append(cards);
        }
        list.append(section);
      }
    }
    function syncKind() {
      const free = document.getElementById('kind').value === 'free';
      document.querySelectorAll('.tournament-field').forEach(field => {
        field.hidden = free;
        field.querySelectorAll('select, input').forEach(control => { control.disabled = free; });
      });
      document.getElementById('endField').hidden = !free;
      document.getElementById('endTime').required = free;
      document.getElementById('tablesNoticeField').hidden = !free;
      document.getElementById('tablesNotice').disabled = !free;
      syncEntryType();
    }
    function syncEntryType() {
      const priceType = document.getElementById('entryType').value;
      const amount = priceType === 'amount';
      document.getElementById('valueField').hidden = !amount;
      document.getElementById('value').disabled = !amount;
      document.getElementById('value').required = amount;
    }
    document.getElementById('entryType').addEventListener('change', syncEntryType);
    document.getElementById('kind').addEventListener('change', () => {
      document.getElementById('entryType').value = document.getElementById('kind').value === 'free' ? 'free' : 'amount';
      syncKind();
    });
    function syncStoreType() {
      const option = document.querySelector('[data-neruda-only]');
      const allowed = document.getElementById('store').value === 'neruda';
      option.hidden = !allowed; option.disabled = !allowed;
      if (!allowed && document.getElementById('eventType').value === option.value) document.getElementById('eventType').value = 'Torneo Casual';
    }
    document.getElementById('store').addEventListener('change', syncStoreType);
    function resetForm() {
      editingId = null; form.reset(); syncKind(); syncStoreType();
      document.getElementById('submitEvent').textContent = t('publish');
      document.getElementById('cancelEdit').hidden = true;
    }
    document.getElementById('cancelEdit').addEventListener('click', resetForm);
    function editEvent(id) {
      if (!isAdmin || !validEvent(events[id])) return;
      const event = events[id];
      editingId = id;
      for (const key of ['store','kind','date','time','endTime','value']) document.getElementById(key).value = event[key] ?? '';
      document.getElementById('entryType').value = entryTypeFor(event);
      syncStoreType();
      document.getElementById('eventType').value = event.type || 'Torneo Casual';
      document.getElementById('format').value = event.format || 'Rondas Suizas Bo1';
      document.getElementById('tablesNotice').checked = Boolean(event.showTableAvailabilityNote);
      syncKind();
      document.getElementById('submitEvent').textContent = t('update');
      document.getElementById('cancelEdit').hidden = false;
      document.getElementById('admin').scrollIntoView({ behavior:'smooth' });
      document.getElementById('store').focus();
    }
    function collectEvent() {
      const kind = document.getElementById('kind').value;
      const entryType = document.getElementById('entryType').value;
      const event = { store:document.getElementById('store').value, kind, date:document.getElementById('date').value, time:document.getElementById('time').value };
      if (kind === 'free') { event.endTime = document.getElementById('endTime').value; event.showTableAvailabilityNote = document.getElementById('tablesNotice').checked; }
      else {
        event.entryType = document.getElementById('entryType').value;
        if (event.entryType === 'amount') event.value = Number(document.getElementById('value').value);
        event.type = document.getElementById('eventType').value;
        event.format = document.getElementById('format').value;
      }
      return event;
    }
    async function deleteEvent(id) {
      if (!isAdmin || !events[id] || !confirm(t('deleteConfirm'))) return;
      try { await database.remove(database.child(eventsRef,id)); if (editingId === id) resetForm(); formStatus.textContent = t('removed'); }
      catch { formStatus.textContent = t('deleteError'); }
    }
    form.addEventListener('submit', async e => {
      e.preventDefault();
      if (!isAdmin || !auth.currentUser || !form.reportValidity()) return;
      const event = collectEvent();
      const instant = new Date(`${event.date}T${event.time}:00`);
      if (!validEvent(event) || Number.isNaN(instant.getTime()) || instant.getFullYear() !== Number(event.date.slice(0,4)) || instant.getMonth() + 1 !== Number(event.date.slice(5,7)) || instant.getDate() !== Number(event.date.slice(8,10))) { formStatus.textContent = t('dateError'); return; }
      if (event.kind === 'free' && event.endTime <= event.time) { formStatus.textContent = t('endError'); return; }
      if (event.kind === 'tournament' && (!Number.isSafeInteger(event.value) || event.value < 0)) { document.getElementById('value').focus(); return; }
      const button = document.getElementById('submitEvent');
      button.disabled = true; formStatus.textContent = '';
      try {
        await database.set(editingId ? database.child(eventsRef,editingId) : database.push(eventsRef),event);
        resetForm(); formStatus.textContent = t('saved');
      } catch { formStatus.textContent = t('saveError'); }
      finally { button.disabled = false; }
    });

    try {
      const base = 'https://www.gstatic.com/firebasejs/12.19.0/';
      const [{initializeApp},dbModule] = await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-database.js')]);
      database = dbModule;
      const app = initializeApp(firebaseConfig);
      eventsRef = dbModule.ref(dbModule.getDatabase(app),'agenda/events');
      dbModule.onValue(eventsRef, snapshot => { events = snapshot.val() || {}; listStatus.textContent = ''; render(); }, () => { listStatus.textContent = t('unavailable'); });
      if (new URLSearchParams(location.search).has('admin')) {
        const admin = document.getElementById('admin'); admin.hidden = false;
        const { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } = await import(base+'firebase-auth.js');
        auth = getAuth(app);
        const signInButton = document.getElementById('signIn'), signOutButton = document.getElementById('signOut');
        onAuthStateChanged(auth,user => {
          isAdmin = Boolean(user && user.emailVerified && user.email?.toLowerCase() === adminEmail && user.providerData.some(provider => provider.providerId === 'google.com'));
          form.hidden = !isAdmin;
          signInButton.hidden = Boolean(user);
          signOutButton.hidden = !user;
          document.getElementById('authStatus').textContent = user ? t(isAdmin ? 'welcome' : 'denied') : t('signIn');
          if (!isAdmin) resetForm();
          render();
        });
        signInButton.addEventListener('click', async () => {
          try { await signInWithPopup(auth,new GoogleAuthProvider()); }
          catch { document.getElementById('authStatus').textContent = t('authError'); }
        });
        signOutButton.addEventListener('click', async () => { await signOut(auth); });
      }
    } catch { listStatus.textContent = t('unavailable'); }
  </script>
</body>
</html>
