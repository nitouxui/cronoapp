<!doctype html>
<html lang="es">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#11131a">
  <title>Acceso Staff · CronoApp</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #11131a; color: #f7f7fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 0, #29263e 0, #11131a 55%); }
    main { width: min(100%, 440px); padding: 30px; border: 1px solid #343543; border-radius: 22px; background: #1a1c26; box-shadow: 0 24px 70px #0006; }
    .eyebrow { color: #b8a9ff; font-size: 12px; font-weight: 800; letter-spacing: .16em; }
    h1 { margin: 10px 0 8px; font-size: clamp(26px, 7vw, 34px); letter-spacing: -.03em; }
    p { margin: 0 0 22px; color: #b8bac8; line-height: 1.5; }
    form { display: grid; gap: 12px; }
    form[hidden] { display: none; }
    label { font-size: 14px; font-weight: 700; }
    input { width: 100%; min-height: 50px; padding: 12px 14px; border: 1px solid #454657; border-radius: 12px; background: #11131a; color: #fff; font: inherit; font-size: 17px; }
    input:focus { outline: 2px solid #a78bfa; outline-offset: 2px; }
    button { min-height: 50px; padding: 0 18px; border: 0; border-radius: 12px; background: #8065ec; color: white; font: inherit; font-weight: 800; cursor: pointer; }
    button.secondary { border: 1px solid #454657; background: transparent; color: #ddddec; }
    #status { min-height: 1.5em; margin: 14px 0 0; color: #ffb4ab; font-size: 14px; }
    .home { display: inline-block; margin-top: 12px; color: #c5b8ff; font-size: 14px; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">CRONOAPP · VISTA STAFF</span>
    <h1 id="title">Ingresa el código de sala</h1>
    <p id="description">Primero identifica la sala para continuar.</p>
    <form id="codeForm">
      <label for="codeInput">Código de sala</label>
      <input id="codeInput" type="text" inputmode="text" autocapitalize="characters" autocomplete="off" maxlength="6" pattern="[A-HJ-NP-Z2-9]{6}" placeholder="Ej. 7KQ2BD" required>
      <button type="submit">Continuar</button>
    </form>
    <form id="nameForm" hidden>
      <label for="nameInput">Tu nombre</label>
      <input id="nameInput" type="text" maxlength="60" autocomplete="name" placeholder="Escribe tu nombre" required>
      <button type="submit">Entrar a Staff</button>
      <button id="backButton" class="secondary" type="button">Cambiar código de sala</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <a class="home" href="/?resume=1">Volver al inicio</a>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var codeForm = document.getElementById('codeForm');
      var nameForm = document.getElementById('nameForm');
      var codeInput = document.getElementById('codeInput');
      var nameInput = document.getElementById('nameInput');
      var status = document.getElementById('status');
      var title = document.getElementById('title');
      var description = document.getElementById('description');
      var hasRoomId = /^[A-Za-z0-9_-]{8,64}$/.test(params.get('sala') || '');
      var roomCode = params.get('s') || '';
      var hasRoomCode = /^[A-HJ-NP-Z2-9]{6}$/.test(roomCode);

      function showNameStep() {
        codeForm.hidden = true;
        nameForm.hidden = false;
        title.textContent = 'Identifícate como Staff';
        description.textContent = 'Ingresa tu nombre para que administración sepa quién escribe.';
        nameInput.focus();
      }

      if (hasRoomId || hasRoomCode) {
        if (!hasRoomId) params.set('s', roomCode.toUpperCase());
        showNameStep();
      } else {
        params.delete('sala');
        params.delete('s');
        codeForm.hidden = false;
        nameForm.hidden = true;
        codeInput.focus();
      }

      codeInput.addEventListener('input', function () {
        codeInput.value = codeInput.value.toUpperCase().replace(/[^A-HJ-NP-Z2-9]/g, '').slice(0, 6);
        status.textContent = '';
      });

      codeForm.addEventListener('submit', function (event) {
        event.preventDefault();
        var code = codeInput.value.trim().toUpperCase();
        if (!/^[A-HJ-NP-Z2-9]{6}$/.test(code)) {
          status.textContent = 'Ingresa un código válido de 6 caracteres.';
          codeInput.focus();
          return;
        }
        params.delete('sala');
        params.set('s', code);
        showNameStep();
      });

      document.getElementById('backButton').addEventListener('click', function () {
        nameForm.hidden = true;
        codeForm.hidden = false;
        title.textContent = 'Ingresa el código de sala';
        description.textContent = 'Primero identifica la sala para continuar.';
        codeInput.value = params.get('s') || '';
        codeInput.focus();
      });

      nameForm.addEventListener('submit', function (event) {
        event.preventDefault();
        var name = nameInput.value.trim().slice(0, 60);
        if (!name) {
          status.textContent = 'Ingresa tu nombre para continuar.';
          nameInput.focus();
          return;
        }
        params.delete('entry');
        params.set('view', 'staff');
        params.set('nombre', name);
        window.location.assign('/?' + params.toString());
      });
    })();
  </script>
</body>
</html>
